name: Image

# quay.io/edgestack/python-docker: main publishes :dev, a release tag vX.Y.Z on
# release-X.Y publishes :vX.Y.Z once and latest for the newest (the shared workflow of
# petasus-ai/.github).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}

# The shared workflow publishes the GitHub release of a release tag.
permissions:
  contents: write

jobs:
  image:
    uses: petasus-ai/.github/.github/workflows/image.yml@903fcb392fd610f96a6b9f44fb9bfe2751c0b8a5
    with:
      image: quay.io/edgestack/python-docker
    secrets:
      registry-password: ${{ secrets.QUAY_CI_BOT_SECRET }}
